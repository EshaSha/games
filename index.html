<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Список игр</title>
<meta name="description" content="Список игр для выбора на следующий стрим. Нажмите «Копировать», чтобы скопировать название игры.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="header wrap">
  <p class="eyebrow">Steam</p>
  <h1>Список игр</h1>
  <p class="sub">Список, из которого можно выбрать игру на следующий стрим. Нажав кнопку «Копировать», скопируется название игры.</p>
  <dl class="stats">
    <div class="stat">
      <dt>Игр</dt>
      <dd id="stat-total">0</dd>
    </div>
    <div class="stat">
      <dt>Часов</dt>
      <dd id="stat-hours">0</dd>
    </div>
  </dl>
</header>

<main class="wrap">
  <section class="controls" aria-label="Поиск и сортировка">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
      <input id="search" type="search" placeholder="Поиск по названию или жанру" autocomplete="off" aria-label="Поиск по названию или жанру">
    </div>

    <label class="sort">
      <span class="sort-label">Сортировка</span>
      <span class="select-wrap">
        <select id="sort">
          <option value="title">По названию</option>
          <option value="hours">По часам</option>
        </select>
      </span>
    </label>
  </section>

  <p class="count" id="count"></p>

  <section class="grid" id="grid" aria-live="polite"></section>
  <p class="empty" id="empty" hidden>Ничего не найдено. Попробуйте изменить запрос.</p>
</main>

<footer class="footer wrap">
  <span>Список игр</span>
  <span class="dot" aria-hidden="true"></span>
  <a href="https://store.steampowered.com/" target="_blank" rel="noopener">Steam</a>
</footer>

<script src="games.js"></script>
<script src="app.js"></script>
</body>
</html>
